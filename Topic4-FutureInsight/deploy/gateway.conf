# Single-origin gateway for the nLDT Sandbox Stack.
#
# Why this exists: the stack normally publishes one port per service, and the
# browser calls each directly (see UI/js/sandboxApi.js). That works on a local
# `docker compose up` and collapses the moment the deployment is fronted by
# TLS or by Cloudflare's proxy:
#
#   * a certificate would be needed on every published port, and
#   * Cloudflare's proxy only forwards a fixed port list — for HTTPS that is
#     443, 2053, 2083, 2087, 2096, 8443 and nothing else, so 8001-8014 never
#     reach the origin at all, regardless of what the origin listens on.
#
# So instead everything is served from one origin and routed by path prefix.
# The prefixes below are the contract with sandboxApi.js's API_ROUTES and
# TOOL_SERVICES, and with cookbook-registry's PUBLIC_TOOL_BASE — change one
# and you must change all three.
#
# A pleasant side effect: nothing is cross-origin any more, so the wide-open
# CORS policy in each service stops being load-bearing.
#
# Used by docker-compose.gateway.yml, which mounts this into an nginx
# container on the compose network — hence the docker service names below
# rather than published ports.

# Docker's embedded DNS server. Needed because every proxy_pass below targets
# a *variable* rather than a literal host, which is what forces nginx to
# resolve the name per request (cached for `valid`) instead of once at
# startup. With a literal name — or an upstream{} block — nginx pins the IP it
# resolved at boot, and any backend container that later restarts with a new
# IP would 502 until the gateway itself was restarted. That is a genuinely
# confusing failure, so it is worth the small amount of machinery here.
resolver 127.0.0.11 valid=10s ipv6=off;

# Cloudflare sets X-Forwarded-Proto to the scheme the *browser* used, which
# behind "Flexible" SSL is https even though Cloudflare reaches this gateway
# over plain http. Pass that through so services can build correct absolute
# links. On a direct hit to the origin the header is absent, and forwarding
# an empty one is worse than not forwarding at all — so fall back to the
# scheme actually in use.
map $http_x_forwarded_proto $fwd_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    server_name _;

    # Emit relative Location headers. By default nginx rebuilds redirects as
    # absolute URLs from server_name and the *listening* port — which here is
    # this container's internal port 80, not the address the client actually
    # used. Behind a tunnel or proxy that leaks the internal address into a
    # user-facing redirect and sends the browser somewhere that does not
    # exist. Verified: without this, `/api/records` 308s to
    # `http://localhost/api/records/`, silently dropping the real port.
    absolute_redirect off;

    # Recipe CWL documents and GeoJSON geometry payloads (Rotterdam's boundary
    # from PDOK is not small) exceed nginx's 1m default.
    client_max_body_size 25m;

    # A recipe run is a synchronous call that fans out to several tools and,
    # for the buffer recipe, waits on a live PDOK fetch. The 60s default is
    # tight for that. Note that Cloudflare imposes its own ~100s limit on the
    # free plan (error 524) which this cannot raise.
    proxy_read_timeout 180s;
    proxy_send_timeout 180s;

    proxy_http_version 1.1;
    # $http_host, not $host: it keeps a non-default port (e.g. :8080 without
    # Cloudflare in front), so the links the services build from it still
    # work. Behind Cloudflare both are just the public host name.
    proxy_set_header Host              $http_host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $fwd_proto;
    proxy_set_header X-Forwarded-Host  $http_host;

    # --- backend services -------------------------------------------------
    # Each block strips its own prefix with `rewrite ... break`
    # (/api/records/collections/x -> /collections/x) rather than the usual
    # trailing-slash-on-proxy_pass trick, which is unavailable once the target
    # is a variable. Query strings carry over untouched.
    #
    # The paired `= /api/...` redirects cover a bare prefix with no trailing
    # slash, which would otherwise miss these blocks entirely.

    location = /api/records   { return 308 /api/records/; }
    location ^~ /api/records/ {
        set $svc_records http://records-wrapper:8000;
        rewrite ^/api/records/(.*)$ /$1 break;
        proxy_pass $svc_records;
    }

    location = /api/cookbook   { return 308 /api/cookbook/; }
    location ^~ /api/cookbook/ {
        set $svc_cookbook http://cookbook-registry:8000;
        rewrite ^/api/cookbook/(.*)$ /$1 break;
        proxy_pass $svc_cookbook;
    }

    location = /api/orchestrator   { return 308 /api/orchestrator/; }
    location ^~ /api/orchestrator/ {
        set $svc_orch http://cook-orchestrator:8000;
        rewrite ^/api/orchestrator/(.*)$ /$1 break;
        proxy_pass $svc_orch;
    }

    location = /api/hub   { return 308 /api/hub/; }
    location ^~ /api/hub/ {
        set $svc_hub http://hub-datasets:8000;
        rewrite ^/api/hub/(.*)$ /$1 break;
        proxy_pass $svc_hub;
    }

    # --- tool (leaf process) services -------------------------------------
    location = /api/tools/add   { return 308 /api/tools/add/; }
    location ^~ /api/tools/add/ {
        set $svc_add http://tool-add:8000;
        rewrite ^/api/tools/add/(.*)$ /$1 break;
        proxy_pass $svc_add;
    }

    # multiply3 before multiply: nginx picks the longest matching prefix, so
    # this ordering is documentation rather than logic — but the two names are
    # close enough that spelling it out is worth the line.
    location = /api/tools/multiply3   { return 308 /api/tools/multiply3/; }
    location ^~ /api/tools/multiply3/ {
        set $svc_mul3 http://tool-multiply3:8000;
        rewrite ^/api/tools/multiply3/(.*)$ /$1 break;
        proxy_pass $svc_mul3;
    }

    location = /api/tools/multiply   { return 308 /api/tools/multiply/; }
    location ^~ /api/tools/multiply/ {
        set $svc_mul http://tool-multiply:8000;
        rewrite ^/api/tools/multiply/(.*)$ /$1 break;
        proxy_pass $svc_mul;
    }

    location = /api/tools/geo-buffer   { return 308 /api/tools/geo-buffer/; }
    location ^~ /api/tools/geo-buffer/ {
        set $svc_buf http://tool-geo-buffer:8000;
        rewrite ^/api/tools/geo-buffer/(.*)$ /$1 break;
        proxy_pass $svc_buf;
    }

    # --- the static UI ----------------------------------------------------
    # Last, and deliberately a bare prefix: everything not claimed above is
    # the single-page app. No rewrite — the UI's own asset paths are relative
    # to the root and pass through unchanged.
    location / {
        set $svc_ui http://ui:80;
        proxy_pass $svc_ui;
    }
}
